name: Deploy Portfolio

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Wait for Tailscale
        run: sleep 5

      - name: Check connectivity
        run: |
          set -x
          tailscale status
          echo "Runner TS IP: $(tailscale ip -4)"

          # Test Tailscale connectivity to aquinohome (best signal)
          tailscale ping -c 3 aquinohome

          # Test SSH port without failing the whole job (prints result)
          nc -vz -w 5 aquinohome 22 && echo "SSH reachable" || (echo "SSH not reachable"; exit 1)

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /var/www/portfolio
            git fetch origin
            git reset --hard origin/main
            npm ci
            mkdir -p ./public/dist
            npx tailwindcss -i ./src/input.css -o ./public/dist/output.css --minify
