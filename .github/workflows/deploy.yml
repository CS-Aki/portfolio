name: Deploy Portfolio

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Wait for Tailscale
        run: sleep 5

      - name: Check connectivity (diagnostics)
        run: |
          set -x
          tailscale status
          tailscale netcheck || true
          tailscale debug prefs | sed -n '1,200p' || true

          # DNS / MagicDNS check
          getent hosts aquinohome || true
          tailscale ping -c 3 -verbose aquinohome || true

          # Try direct to TS IP too
          tailscale ping -c 3 -verbose 100.103.96.121 || true

          # SSH port check
          nc -vz -w 5 100.103.96.121 22 || true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /var/www/portfolio
            git fetch origin
            git reset --hard origin/main
            npm ci
            mkdir -p ./public/dist
            npx tailwindcss -i ./src/input.css -o ./public/dist/output.css --minify
